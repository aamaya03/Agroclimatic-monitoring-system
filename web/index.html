<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agroclimatic Monitoring System</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="loading-screen" class="hidden">
    <div class="spinner"><div></div><div></div><div></div></div>
    <div id="loading-text"></div>
  </div>

  <main class="layout">
    <!-- ============ Panel lateral ============ -->
    <aside class="sidebar">
      <p class="help"><strong>Choose a mode to analyze the area:</strong></p>
      <div class="mode-buttons">
        <button id="btn-lote" class="btn btn-mode">Select by Plot</button>
        <button id="btn-poligono" class="btn btn-mode">Draw Polygon</button>
        <button id="btn-borrar" class="btn">&#8634; Clear Selection</button>
      </div>

      <div class="field" id="sensor-field">
        <label for="sensor">Select sensor:</label>
        <select id="sensor"></select>
      </div>

      <div class="field">
        <label>Select date range:</label>
        <div class="date-range">
          <input type="date" id="fecha-inicio" />
          <span>to</span>
          <input type="date" id="fecha-fin" />
        </div>
        <small id="window-note" class="note"></small>
      </div>

      <div class="field index-row">
        <div>
          <label for="indice">Select index:</label>
          <select id="indice"></select>
        </div>
        <button id="btn-info" class="btn-info" title="Index information" aria-expanded="false" aria-controls="info-pop">i</button>
        <div id="info-pop" class="popover hidden" role="dialog" aria-label="Index information"></div>
      </div>

      <label class="check"><input type="checkbox" id="toggle-raster" checked /> Show Raster</label>

      <pre id="info-lote" class="hidden"></pre>

      <div class="table-wrap">
        <table id="tabla-resultados"></table>
      </div>
      <button id="btn-descargar" class="btn btn-download hidden">&#11015; Download Data</button>
    </aside>

    <!-- ============ Mapa + gráfico ============ -->
    <section class="main">
      <div class="map-wrap">
        <div id="map"></div>
        <div id="coach" class="coach hidden" role="status"></div>
        <div id="toast-zone" class="toast-zone" aria-live="polite"></div>
      </div>
      <div id="chart-container">
        <div id="chart-toolbar">
          <label><input type="radio" name="chart-type" value="ts" checked /> 📈 Time series</label>
          <label><input type="radio" name="chart-type" value="hist" /> 📊 Area distribution</label>
        </div>
        <div id="chart"></div>
        <div id="chart-empty" class="chart-empty">Select a plot or draw a polygon to see the chart.</div>
      </div>
    </section>
  </main>

  <div id="modal" class="modal hidden" role="alertdialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box">
      <button class="icon-btn modal-x" id="modal-x" aria-label="Close"></button>
      <div class="modal-head">
        <div class="badge-icon danger" id="modal-icon"></div>
        <div>
          <h3 id="modal-title"></h3>
          <p id="modal-body"></p>
        </div>
      </div>
      <div class="modal-actions">
        <button id="modal-close" class="btn">Close</button>
        <button id="modal-action" class="btn btn-primary hidden"></button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
