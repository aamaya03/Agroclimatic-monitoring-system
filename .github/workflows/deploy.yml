# Publica el visor en GitHub Pages.
# Toma el código de la carpeta web/ y los datos del Release más reciente.
# Los datos nunca se guardan en el repositorio, así que no crece con el tiempo.

name: Publicar visor

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Descargar datos del Release más reciente
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release download --repo "$GITHUB_REPOSITORY" --pattern "datos_sitio.zip" --dir /tmp; then
            echo "::error::No se encontró datos_sitio.zip en el Release más reciente. Crea un Release y adjunta ese archivo."
            exit 1
          fi
          mkdir -p site/data
          unzip -q /tmp/datos_sitio.zip -d site/data
          if [ ! -f site/data/catalog.json ]; then
            echo "::error::datos_sitio.zip no contiene catalog.json. Vuelve a generarlo con scripts/prepare_data.py"
            exit 1
          fi

      - name: Armar el sitio
        run: |
          cp -r web/. site/
          echo "Tamaño del sitio:"; du -sh site
          SIZE=$(du -sm site | cut -f1)
          if [ "$SIZE" -gt 1000 ]; then
            echo "::error::El sitio pesa ${SIZE} MB y GitHub Pages admite hasta 1 GB."
            exit 1
          fi

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
